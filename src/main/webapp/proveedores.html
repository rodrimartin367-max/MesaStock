<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7f4">
    <title>Proveedores | Inventario de restaurante</title><link rel="stylesheet" href="css/styles.css"><script type="module" src="js/proveedores.js"></script>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html">Mesa<span>Stock</span></a><nav aria-label="Navegación principal"><a href="index.html">Panel</a><a href="productos.html">Productos</a><a href="categorias.html">Categorías</a><a href="proveedores.html" aria-current="page">Proveedores</a><a href="movimientos.html">Movimientos</a></nav></header>
<main class="page-shell">
    <section class="page-heading"><div><p class="eyebrow">RED DE SUMINISTRO</p><h1>Proveedores</h1><p class="intro">Gestiona los contactos que abastecen tu restaurante.</p></div><button id="nuevo-proveedor" class="button button-primary" type="button">Añadir proveedor</button></section>
    <section class="content-panel"><p id="proveedores-status" class="status-message" role="status" aria-live="polite"></p><p id="proveedores-vacios" class="empty-state" hidden>No hay proveedores todavía.</p><div class="table-scroll"><table><caption class="visually-hidden">Proveedores registrados</caption><thead><tr><th scope="col">Nombre</th><th scope="col">CIF</th><th scope="col">Teléfono</th><th scope="col">Correo electrónico</th><th scope="col"><span class="visually-hidden">Acciones</span></th></tr></thead><tbody id="proveedores-body"></tbody></table></div></section>
</main>
<dialog id="proveedor-dialog" class="dialog-card" aria-labelledby="proveedor-dialog-title"><form id="proveedor-form" novalidate><div class="dialog-heading"><div><p class="eyebrow">DATOS DE CONTACTO</p><h2 id="proveedor-dialog-title">Añadir proveedor</h2></div><button class="icon-button" type="button" data-close-dialog="proveedor-dialog" aria-label="Cerrar">×</button></div><input name="id" type="hidden"><div class="form-grid"><div class="field"><label for="proveedor-nombre">Nombre</label><input id="proveedor-nombre" name="nombre" maxlength="100" required autocomplete="organization"><span class="field-error" data-error-for="nombre"></span></div><div class="field"><label for="proveedor-cif">CIF</label><input id="proveedor-cif" name="cif" maxlength="9" required autocomplete="off"><span class="field-error" data-error-for="cif"></span></div><div class="field"><label for="proveedor-telefono">Teléfono</label><input id="proveedor-telefono" name="telefono" maxlength="20" type="tel" autocomplete="tel"><span class="field-error" data-error-for="telefono"></span></div><div class="field"><label for="proveedor-email">Correo electrónico</label><input id="proveedor-email" name="email" maxlength="120" type="email" autocomplete="email"><span class="field-error" data-error-for="email"></span></div></div><div class="dialog-actions"><button class="button button-secondary" type="button" data-close-dialog="proveedor-dialog">Cancelar</button><button class="button button-primary" type="submit">Guardar proveedor</button></div></form></dialog>
<dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title">Confirmar acción</h2><p data-confirm-message></p><div class="dialog-actions"><button class="button button-secondary" value="cancel">Cancelar</button><button class="button button-danger" value="confirm">Confirmar</button></div></form></dialog>
<div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
